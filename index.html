<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizador de Programas CNC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-titulo">
      <span class="topbar-icono">⚙️</span>
      <div>
        <h1>Organizador de Programas CNC</h1>
        <p class="topbar-subtitulo">Cola de elaboración de programas según cercanía de fabricación</p>
      </div>
    </div>
    <button id="btn-recargar" class="btn-secundario">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
      Recargar
    </button>
  </header>

  <section class="panel-carga">
    <details>
      <summary>📥 Cargar Excel diarios</summary>
      <form id="form-carga" class="form-carga">
        <label>
          Listado de tareas externas (.xlsx)
          <input type="file" id="file-externas" accept=".xlsx,.xls" />
        </label>
        <label>
          Tareas pendientes de ejecución (.xlsx)
          <input type="file" id="file-pendientes" accept=".xlsx,.xls" />
        </label>
        <button type="submit" class="btn-primario">Importar</button>
        <span id="estado-import" class="estado-texto"></span>
      </form>
    </details>
  </section>

  <section class="filtros">
    <div class="campo-busqueda">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
      <input type="search" id="filtro-texto" placeholder="Buscar OS, componente, parte…" />
    </div>
    <select id="filtro-urgencia">
      <option value="todas">Todas las urgencias</option>
      <option value="atrasado">🔴 Atrasado</option>
      <option value="proximo">🟠 Próximo (&lt;24h)</option>
      <option value="a-tiempo">🟢 A tiempo</option>
      <option value="sin-fecha">⚪ Fecha no reconocida</option>
    </select>
    <select id="filtro-maquina">
      <option value="todas">Todas las máquinas</option>
    </select>
    <select id="filtro-estado">
      <option value="activos">Activos (en cola / en espera)</option>
      <option value="todas">Todos los estados</option>
      <option value="en-cola">En cola</option>
      <option value="en-espera">En espera</option>
      <option value="ok">OK</option>
      <option value="cancelada">Cancelada</option>
    </select>
  </section>

  <div class="barra-estado">
    <span id="resumen"></span>
    <span id="estado-carga" class="estado-texto"></span>
  </div>

  <main id="cola" class="lista"></main>

  <section class="sin-cruce-section">
    <details>
      <summary>🔍 Sin cruce con fabricación (<span id="sin-cruce-count">0</span>)</summary>
      <div id="sin-cruce" class="lista"></div>
    </details>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/supabaseClient.js" defer></script>
  <script src="js/reglas.js" defer></script>
  <script src="js/scheduler.js" defer></script>
  <script src="js/importer.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
